{% extends "_auth.html" %}
{% block title %}Choose a password · PhD Tracker{% endblock %}
{% block card %}
<h1>Welcome, {{ invited.name | firstname }}</h1>
<p class="lead">Choose a password for <strong>{{ invited.email }}</strong> to get started.</p>
{% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/invite/{{ token }}">
  <label class="field"><span>Password</span><input type="password" name="password" minlength="10" autocomplete="new-password" required autofocus><small class="hint">At least 10 characters.</small></label>
  <label class="field"><span>Repeat password</span><input type="password" name="password2" minlength="10" autocomplete="new-password" required></label>
  <button type="submit" class="btn btn-primary btn-block btn-lg">Set password</button>
</form>
{% endblock %}
